name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Restore CI image cache
        uses: actions/cache@v4
        with:
          path: /tmp/fnl-lux-ci-image.tar
          key: fnl-lux-ci-${{ hashFiles('Containerfile') }}
          restore-keys: |
            fnl-lux-ci-

      - name: Load cached image
        run: |
          if [ -f /tmp/fnl-lux-ci-image.tar ]; then
            podman load -i /tmp/fnl-lux-ci-image.tar
          fi

      - name: Run tests
        run: ./scripts/ci-test.sh

      - name: Save CI image cache
        if: success()
        run: podman save fnl-lux-ci:local -o /tmp/fnl-lux-ci-image.tar
